<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="spicyComboBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a0d0d" />
      <stop offset="100%" stop-color="#070202" />
    </radialGradient>
    <filter id="comboShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#spicyComboBg)" />
  <circle cx="400" cy="400" r="320" fill="#dc2626" opacity="0.12" filter="blur(70px)" />

  <g filter="url(#comboShadow)">
    
    <!-- Item 1: Buldak 2x Packet (left tilt) -->
    <g transform="translate(180, 240) rotate(-8)">
      <!-- Black packet -->
      <rect x="0" y="0" width="220" height="320" rx="14" fill="#181a20" stroke="#dc2626" stroke-width="2.5" />
      <!-- Crimp top & bottom -->
      <rect x="0" y="0" width="220" height="24" rx="4" fill="#2d333f" />
      <rect x="0" y="296" width="220" height="24" rx="4" fill="#2d333f" />
      <text x="110" y="70" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">SAMYANG</text>
      <rect x="30" y="90" width="160" height="60" rx="8" fill="#dc2626" />
      <text x="110" y="130" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fbbf24" text-anchor="middle">2x SPICY</text>
      <text x="110" y="145" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">BULDAK RAMEN</text>
      <rect x="35" y="190" width="150" height="50" rx="8" fill="#0f1115" stroke="#374151" />
      <text x="110" y="210" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f87171" text-anchor="middle">AIRTIGHT PACKET</text>
      <text x="110" y="226" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">140g Ramen + Sauce</text>
    </g>

    <!-- Item 2: Sting Chilled Bottle (center) -->
    <g transform="translate(360, 210)">
      <!-- Bottle neck & cap -->
      <rect x="32" y="0" width="26" height="30" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
      <!-- PET Bottle Body -->
      <path d="M 32,30 L 15,90 L 10,360 L 80,360 L 75,90 L 58,30 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2.5" />
      <!-- Liquid glow -->
      <rect x="18" y="100" width="54" height="250" rx="6" fill="#f87171" opacity="0.6" />
      <!-- Label -->
      <rect x="14" y="180" width="62" height="90" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1.5" />
      <text x="45" y="225" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(-90 45 225)">STING</text>
      <text x="45" y="320" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fef08a" text-anchor="middle">250ml Chilled</text>
    </g>

    <!-- Item 3: Kurkure Masala Munch (right tilt) -->
    <g transform="translate(460, 260) rotate(10)">
      <rect x="0" y="0" width="210" height="300" rx="14" fill="#ea580c" stroke="#c2410c" stroke-width="2.5" />
      <rect x="0" y="0" width="210" height="24" rx="4" fill="#9a3412" />
      <rect x="0" y="276" width="210" height="24" rx="4" fill="#9a3412" />
      <text x="105" y="70" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle">Kurkure</text>
      <rect x="25" y="90" width="160" height="40" rx="8" fill="#7c2d12" />
      <text x="105" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MASALA MUNCH</text>
      <circle cx="105" cy="180" r="35" fill="#f97316" stroke="#fbbf24" stroke-width="2" />
      <text x="105" y="185" font-family="sans-serif" font-size="10" font-weight="black" fill="#ffffff" text-anchor="middle">SEALED</text>
      <text x="105" y="245" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">82g Stay-Fresh Pack</text>
    </g>

  </g>

  <!-- Big Bottom Trio Banner -->
  <g transform="translate(400, 680)">
    <rect x="-260" y="-35" width="520" height="60" rx="16" fill="#18181b" stroke="#ef4444" stroke-width="2.5" />
    <text x="0" y="-6" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="1">
      3x FACTORY SEALED ITEMS
    </text>
    <text x="0" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      1x Buldak 2x Packet + 1x Chilled Sting + 1x Kurkure Pack
    </text>
  </g>

  <!-- Top Banner -->
  <g transform="translate(400, 100)">
    <rect x="-190" y="-20" width="380" height="42" rx="21" fill="#dc2626" stroke="#f87171" stroke-width="2" />
    <text x="0" y="7" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      🔥 2 AM SPICY DARE PACK
    </text>
  </g>
</svg>
