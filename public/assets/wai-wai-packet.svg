<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="waiwaiBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="100%" stop-color="#0a0806" />
    </radialGradient>

    <!-- Brown/Bronze Metallic Pouch Gradient -->
    <linearGradient id="pouchBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="85%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#290e02" />
    </linearGradient>

    <!-- Foil Sheen -->
    <linearGradient id="waiwaiSheen" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <pattern id="waiwaiCrimp" width="12" height="24" patternUnits="userSpaceOnUse">
      <rect width="6" height="24" fill="#451a03" />
      <rect x="6" width="6" height="24" fill="#d97706" />
    </pattern>

    <filter id="waiwaiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#d97706" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#waiwaiBg)" />
  <circle cx="400" cy="400" r="280" fill="#d97706" opacity="0.12" filter="blur(60px)" />

  <g filter="url(#waiwaiShadow)">
    <!-- Top Crimp -->
    <path d="M 210,130 
             L 215,122 L 225,130 L 235,122 L 245,130 L 255,122 L 265,130 L 275,122 L 285,130 L 295,122 L 305,130 
             L 315,122 L 325,130 L 335,122 L 345,130 L 355,122 L 365,130 L 375,122 L 385,130 L 395,122 L 405,130 
             L 415,122 L 425,130 L 435,122 L 445,130 L 455,122 L 465,130 L 475,122 L 485,130 L 495,122 L 505,130 
             L 515,122 L 525,130 L 535,122 L 545,130 L 555,122 L 565,130 L 575,122 L 585,130 L 590,130 
             L 590,165 L 210,165 Z" 
          fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    <rect x="210" y="130" width="380" height="35" fill="url(#waiwaiCrimp)" opacity="0.35" />

    <!-- Pouch Body -->
    <path d="M 210,165 C 195,300 195,500 210,635 L 590,635 C 605,500 605,300 590,165 Z" 
          fill="url(#pouchBronze)" stroke="#b45309" stroke-width="2" />
    <path d="M 210,165 C 195,300 195,500 210,635 L 590,635 C 605,500 605,300 590,165 Z" 
          fill="url(#waiwaiSheen)" />

    <!-- Bottom Crimp -->
    <path d="M 210,635 L 590,635 L 590,670 
             L 585,678 L 575,670 L 565,678 L 555,670 L 545,678 L 535,670 L 525,678 L 515,670 L 505,678 L 495,670 
             L 485,678 L 475,670 L 465,678 L 455,670 L 445,678 L 435,670 L 425,678 L 415,670 L 405,678 L 395,670 
             L 385,678 L 375,670 L 365,678 L 355,670 L 345,678 L 335,670 L 325,678 L 315,670 L 305,678 L 295,670 
             L 285,678 L 275,670 L 265,678 L 255,670 L 245,678 L 235,670 L 225,678 L 215,670 L 210,670 Z" 
          fill="#78350f" stroke="#451a03" stroke-width="1.5" />
    <rect x="210" y="635" width="380" height="35" fill="url(#waiwaiCrimp)" opacity="0.35" />

    <!-- Brand Emblem -->
    <ellipse cx="400" cy="245" rx="145" ry="55" fill="#dc2626" stroke="#fbbf24" stroke-width="4" />
    <text x="400" y="260" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      WAI WAI
    </text>

    <!-- Subtitle Banner -->
    <rect x="245" y="320" width="310" height="32" rx="16" fill="#f59e0b" />
    <text x="400" y="342" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="0.5">
      READY-TO-EAT NOODLES
    </text>

    <!-- Pre-Cooked Crunch Feature Box -->
    <g transform="translate(400, 440)">
      <rect x="-160" y="-70" width="320" height="135" rx="16" fill="#1c1917" stroke="#b45309" stroke-width="2" />
      <text x="0" y="-35" font-family="sans-serif" font-size="12" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="1">
        ★ DUAL HOSTEL WAY ★
      </text>
      <text x="0" y="-12" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
        1. EAT RAW &amp; CRUNCHY
      </text>
      <text x="0" y="12" font-family="sans-serif" font-size="12" font-weight="medium" fill="#a8a29e" text-anchor="middle">
        Crush pack, add seasonings &amp; shake!
      </text>
      <text x="0" y="38" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fde047" text-anchor="middle">
        2. OR SOAK IN KETTLE (2 MINS)
      </text>
    </g>

    <!-- Seasonings inside Callout -->
    <rect x="235" y="525" width="330" height="32" rx="10" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="400" y="546" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      3 SACHETS: TASTEMAKER + ONION OIL + CHILI
    </text>

    <!-- Net Weight & Packet Info -->
    <rect x="240" y="570" width="320" height="46" rx="12" fill="#0c0a09" stroke="#78350f" stroke-width="1.5" />
    <text x="400" y="591" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      75g • FACTORY SEALED POUCH
    </text>
    <text x="400" y="607" font-family="sans-serif" font-size="11" font-weight="extrabold" fill="#fde047" text-anchor="middle">
      MASALA FLAVOR • VEG NOODLES
    </text>

    <!-- Corner Diagonal Ribbon -->
    <g transform="translate(190, 140)">
      <path d="M 0,90 L 90,0 L 140,0 L 0,140 Z" fill="#b91c1c" />
      <text transform="translate(55, 55) rotate(-45)" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        SEALED PACK
      </text>
    </g>

    <!-- Green Veg Mark -->
    <g transform="translate(230, 180)">
      <rect width="28" height="28" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
      <circle cx="14" cy="14" r="7" fill="#16a34a" />
    </g>

    <!-- Top Right: Ready to eat stamp -->
    <g transform="translate(515, 175)">
      <circle cx="28" cy="28" r="26" fill="#1c1917" stroke="#f59e0b" stroke-width="2" />
      <text x="28" y="24" font-family="sans-serif" font-size="8" font-weight="900" fill="#94a3b8" text-anchor="middle">READY TO</text>
      <text x="28" y="37" font-family="sans-serif" font-size="10" font-weight="900" fill="#4ade80" text-anchor="middle">CRUNCH</text>
    </g>

  </g>
</svg>
