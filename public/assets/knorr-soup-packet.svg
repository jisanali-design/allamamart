<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="knorrBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f2619" />
      <stop offset="100%" stop-color="#040d08" />
    </radialGradient>

    <!-- Deep Green Foil Gradient -->
    <linearGradient id="pouchGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="40%" stop-color="#14532d" />
      <stop offset="85%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#021f0e" />
    </linearGradient>

    <linearGradient id="knorrSheen" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <pattern id="knorrCrimp" width="12" height="24" patternUnits="userSpaceOnUse">
      <rect width="6" height="24" fill="#052e16" />
      <rect x="6" width="6" height="24" fill="#22c55e" />
    </pattern>

    <filter id="knorrShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#16a34a" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#knorrBg)" />
  <circle cx="400" cy="400" r="280" fill="#16a34a" opacity="0.12" filter="blur(60px)" />

  <g filter="url(#knorrShadow)">
    <!-- Top Crimp -->
    <path d="M 210,130 
             L 215,122 L 225,130 L 235,122 L 245,130 L 255,122 L 265,130 L 275,122 L 285,130 L 295,122 L 305,130 
             L 315,122 L 325,130 L 335,122 L 345,130 L 355,122 L 365,130 L 375,122 L 385,130 L 395,122 L 405,130 
             L 415,122 L 425,130 L 435,122 L 445,130 L 455,122 L 465,130 L 475,122 L 485,130 L 495,122 L 505,130 
             L 515,122 L 525,130 L 535,122 L 545,130 L 555,122 L 565,130 L 575,122 L 585,130 L 590,130 
             L 590,165 L 210,165 Z" 
          fill="#14532d" stroke="#052e16" stroke-width="1.5" />
    <rect x="210" y="130" width="380" height="35" fill="url(#knorrCrimp)" opacity="0.35" />

    <!-- Pouch Body -->
    <path d="M 210,165 C 195,300 195,500 210,635 L 590,635 C 605,500 605,300 590,165 Z" 
          fill="url(#pouchGreen)" stroke="#16a34a" stroke-width="2" />
    <path d="M 210,165 C 195,300 195,500 210,635 L 590,635 C 605,500 605,300 590,165 Z" 
          fill="url(#knorrSheen)" />

    <!-- Bottom Crimp -->
    <path d="M 210,635 L 590,635 L 590,670 
             L 585,678 L 575,670 L 565,678 L 555,670 L 545,678 L 535,670 L 525,678 L 515,670 L 505,678 L 495,670 
             L 485,678 L 475,670 L 465,678 L 455,670 L 445,678 L 435,670 L 425,678 L 415,670 L 405,678 L 395,670 
             L 385,678 L 375,670 L 365,678 L 355,670 L 345,678 L 335,670 L 325,678 L 315,670 L 305,678 L 295,670 
             L 285,678 L 275,670 L 265,678 L 255,670 L 245,678 L 235,670 L 225,678 L 215,670 L 210,670 Z" 
          fill="#14532d" stroke="#052e16" stroke-width="1.5" />
    <rect x="210" y="635" width="380" height="35" fill="url(#knorrCrimp)" opacity="0.35" />

    <!-- Knorr Brand Logo -->
    <text x="400" y="240" font-family="'Georgia', serif" font-size="52" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">
      Knorr
    </text>

    <!-- Subtitle Banner -->
    <rect x="235" y="275" width="330" height="42" rx="10" fill="#dc2626" />
    <text x="400" y="303" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      HOT &amp; SOUR VEG SOUP MIX
    </text>

    <!-- Dry Soup Powder Sachet Details -->
    <g transform="translate(400, 435)">
      <rect x="-155" y="-70" width="310" height="135" rx="16" fill="#061f12" stroke="#22c55e" stroke-width="2" />
      <text x="0" y="-35" font-family="sans-serif" font-size="12" font-weight="900" fill="#86efac" text-anchor="middle" letter-spacing="1">
        ★ AIRTIGHT FOIL DRY SACHET ★
      </text>
      <text x="0" y="-10" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
        Makes 4 Steaming Cups
      </text>
      <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="medium" fill="#bbf7d0" text-anchor="middle">
        Real crunchy vegetables &amp; black pepper zest
      </text>
      <text x="0" y="38" font-family="sans-serif" font-size="13" font-weight="bold" fill="#facc15" text-anchor="middle">
        ☕ JUST STIR IN BOILING KETTLE WATER
      </text>
    </g>

    <rect x="235" y="525" width="330" height="32" rx="10" fill="#047857" stroke="#34d399" stroke-width="1.5" />
    <text x="400" y="546" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      100% REAL VEGGIE BITS • ZERO PRESERVATIVES
    </text>

    <rect x="240" y="570" width="320" height="46" rx="12" fill="#021f0e" stroke="#166534" stroke-width="1.5" />
    <text x="400" y="591" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      43g • SEALED FOIL SACHET
    </text>
    <text x="400" y="607" font-family="sans-serif" font-size="11" font-weight="extrabold" fill="#4ade80" text-anchor="middle">
      CHINESE RECIPE SOUP MIX
    </text>

    <!-- Corner Diagonal Ribbon -->
    <g transform="translate(190, 140)">
      <path d="M 0,90 L 90,0 L 140,0 L 0,140 Z" fill="#dc2626" />
      <text transform="translate(55, 55) rotate(-45)" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        SEALED SACHET
      </text>
    </g>

    <!-- Green Veg Mark -->
    <g transform="translate(230, 180)">
      <rect width="28" height="28" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
      <circle cx="14" cy="14" r="7" fill="#16a34a" />
    </g>
  </g>
</svg>
