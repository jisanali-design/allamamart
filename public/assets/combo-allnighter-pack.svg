<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="allnighterBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="allnighterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#allnighterBg)" />
  <circle cx="400" cy="400" r="320" fill="#3b82f6" opacity="0.1" filter="blur(70px)" />

  <g filter="url(#allnighterShadow)">
    
    <!-- Item 1: Maggi Yellow Packet (left tilt) -->
    <g transform="translate(180, 240) rotate(-8)">
      <rect x="0" y="0" width="220" height="320" rx="14" fill="#facc15" stroke="#ca8a04" stroke-width="2.5" />
      <rect x="0" y="0" width="220" height="24" rx="4" fill="#ca8a04" />
      <rect x="0" y="296" width="220" height="24" rx="4" fill="#ca8a04" />
      <rect x="30" y="45" width="160" height="55" rx="10" fill="#dc2626" />
      <text x="110" y="85" font-family="'Arial Black', sans-serif" font-size="34" font-weight="900" font-style="italic" fill="#fef08a" text-anchor="middle">Maggi</text>
      <rect x="25" y="115" width="170" height="28" rx="8" fill="#991b1b" />
      <text x="110" y="134" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">2-MINUTE NOODLES</text>
      <rect x="35" y="180" width="150" height="60" rx="8" fill="#1e293b" />
      <text x="110" y="205" font-family="sans-serif" font-size="10" font-weight="900" fill="#facc15" text-anchor="middle">MASALA DUAL PACK</text>
      <text x="110" y="224" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Cook in Kettle (2 mins)</text>
    </g>

    <!-- Item 2: Red Bull Can (center) -->
    <g transform="translate(370, 220)">
      <rect x="0" y="0" width="75" height="340" rx="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <rect x="15" y="-12" width="45" height="14" rx="4" fill="#94a3b8" />
      <rect x="5" y="10" width="65" height="40" fill="#e2e8f0" />
      <rect x="5" y="110" width="65" height="70" fill="#dc2626" />
      <text x="37" y="210" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(-90 37 210)">Red Bull</text>
      <rect x="10" y="270" width="55" height="45" rx="6" fill="#0369a1" />
      <text x="37" y="298" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fef08a" text-anchor="middle">250ml</text>
    </g>

    <!-- Item 3: Lay's Magic Masala Blue Bag (right tilt) -->
    <g transform="translate(470, 250) rotate(10)">
      <rect x="0" y="0" width="210" height="310" rx="14" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5" />
      <rect x="0" y="0" width="210" height="24" rx="4" fill="#1e40af" />
      <rect x="0" y="286" width="210" height="24" rx="4" fill="#1e40af" />
      <circle cx="105" cy="90" r="35" fill="#facc15" stroke="#ef4444" stroke-width="3" />
      <text x="105" y="98" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#dc2626" text-anchor="middle">Lay's</text>
      <rect x="25" y="145" width="160" height="40" rx="8" fill="#1e3a8a" />
      <text x="105" y="170" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">MAGIC MASALA</text>
      <rect x="35" y="210" width="140" height="45" rx="8" fill="#0f172a" />
      <text x="105" y="238" font-family="sans-serif" font-size="10" font-weight="bold" fill="#60a5fa" text-anchor="middle">90g Party Bag</text>
    </g>

  </g>

  <!-- Big Bottom Trio Banner -->
  <g transform="translate(400, 680)">
    <rect x="-260" y="-35" width="520" height="60" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <text x="0" y="-6" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="1">
      3x FACTORY SEALED ITEMS
    </text>
    <text x="0" y="16" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      1x Maggi Dual Pack + 1x Chilled Red Bull + 1x Lay's Party Bag
    </text>
  </g>

  <!-- Top Banner -->
  <g transform="translate(400, 100)">
    <rect x="-200" y="-20" width="400" height="42" rx="21" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="7" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      ⚡ EXAM ALL-NIGHTER COMBO
    </text>
  </g>
</svg>
