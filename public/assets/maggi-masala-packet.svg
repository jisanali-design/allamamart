<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Packet Main Yellow Gradient -->
    <linearGradient id="maggiYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Glossy Plastic Sheen -->
    <linearGradient id="foilSheen" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Red Maggi Brand Gradient -->
    <linearGradient id="maggiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="packetDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.2" />
    </filter>

    <!-- Top & Bottom Crimp Pattern -->
    <pattern id="crimpPattern" width="12" height="24" patternUnits="userSpaceOnUse">
      <rect width="6" height="24" fill="#a16207" />
      <rect x="6" width="6" height="24" fill="#fef08a" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Ambient yellow glow behind packet -->
  <circle cx="400" cy="400" r="280" fill="#eab308" opacity="0.12" filter="blur(60px)" />

  <!-- Main Sealed Packet Container with drop shadow -->
  <g filter="url(#packetDropShadow)">
    
    <!-- Top Heat-Sealed Foil Crimp (crimped serrated edge) -->
    <path d="M 210,130 
             L 215,122 L 225,130 L 235,122 L 245,130 L 255,122 L 265,130 L 275,122 L 285,130 L 295,122 L 305,130 
             L 315,122 L 325,130 L 335,122 L 345,130 L 355,122 L 365,130 L 375,122 L 385,130 L 395,122 L 405,130 
             L 415,122 L 425,130 L 435,122 L 445,130 L 455,122 L 465,130 L 475,122 L 485,130 L 495,122 L 505,130 
             L 515,122 L 525,130 L 535,122 L 545,130 L 555,122 L 565,130 L 575,122 L 585,130 L 590,130 
             L 590,165 L 210,165 Z" 
          fill="#ca8a04" stroke="#854d0e" stroke-width="1.5" />
    <!-- Crimp ridges lines -->
    <rect x="210" y="130" width="380" height="35" fill="url(#crimpPattern)" opacity="0.35" />

    <!-- Sealed Packet Main Body (smooth puffed pouch) -->
    <path d="M 210,165 
             C 195,300 195,500 210,635 
             L 590,635 
             C 605,500 605,300 590,165 Z" 
          fill="url(#maggiYellow)" />

    <!-- Realistic Foil Sheen overlay -->
    <path d="M 210,165 C 195,300 195,500 210,635 L 590,635 C 605,500 605,300 590,165 Z" 
          fill="url(#foilSheen)" />

    <!-- Bottom Heat-Sealed Foil Crimp -->
    <path d="M 210,635 
             L 590,635 
             L 590,670 
             L 585,678 L 575,670 L 565,678 L 555,670 L 545,678 L 535,670 L 525,678 L 515,670 L 505,678 L 495,670 
             L 485,678 L 475,670 L 465,678 L 455,670 L 445,678 L 435,670 L 425,678 L 415,670 L 405,678 L 395,670 
             L 385,678 L 375,670 L 365,678 L 355,670 L 345,678 L 335,670 L 325,678 L 315,670 L 305,678 L 295,670 
             L 285,678 L 275,670 L 265,678 L 255,670 L 245,678 L 235,670 L 225,678 L 215,670 L 210,670 Z" 
          fill="#ca8a04" stroke="#854d0e" stroke-width="1.5" />
    <rect x="210" y="635" width="380" height="35" fill="url(#crimpPattern)" opacity="0.35" />

    <!-- Central Decorative Maggi Red Brand Emblem -->
    <path d="M 265,200 C 265,185 285,180 400,180 C 515,180 535,185 535,200 C 535,275 490,295 400,295 C 310,295 265,275 265,200 Z" 
          fill="url(#maggiRed)" stroke="#fef08a" stroke-width="3" />
    
    <!-- Maggi Wordmark -->
    <text x="400" y="258" font-family="'Arial Black', Impact, sans-serif" font-size="58" font-weight="900" font-style="italic" fill="#fef08a" text-anchor="middle" letter-spacing="-1">
      Maggi
    </text>
    <text x="510" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fef08a">®</text>

    <!-- Subtitle: 2-MINUTE NOODLES -->
    <rect x="250" y="308" width="300" height="34" rx="17" fill="#b91c1c" />
    <text x="400" y="331" font-family="'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      2-MINUTE NOODLES
    </text>

    <!-- Raw Dry Woodle Cake Illustration on Packet Wrapper -->
    <g transform="translate(400, 440)">
      <!-- Dry golden noodle cake background block -->
      <rect x="-135" y="-70" width="270" height="135" rx="20" fill="#eab308" stroke="#ca8a04" stroke-width="3" />
      
      <!-- Wavy dry crisp noodle lines on the wrapper -->
      <path d="M -115,-45 Q -95,-60 -75,-45 Q -55,-30 -35,-45 Q -15,-60 5,-45 Q 25,-30 45,-45 Q 65,-60 85,-45 Q 105,-30 115,-45" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" />
      <path d="M -120,-20 Q -100,-5 -80,-20 Q -60,-35 -40,-20 Q -20,-5 0,-20 Q 20,-35 40,-20 Q 60,-5 80,-20 Q 100,-35 120,-20" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" />
      <path d="M -115,5 Q -95,20 -75,5 Q -55,-10 -35,5 Q -15,20 5,5 Q 25,-10 45,5 Q 65,20 85,5 Q 105,-10 115,5" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" />
      <path d="M -120,30 Q -100,15 -80,30 Q -60,45 -40,30 Q -20,15 0,30 Q 20,45 40,30 Q 60,15 80,30 Q 100,45 120,30" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" />
      
      <!-- Masala Seasoning Spice flecks -->
      <circle cx="-60" cy="-35" r="3" fill="#dc2626" />
      <circle cx="30" cy="-10" r="3.5" fill="#dc2626" />
      <circle cx="-10" cy="15" r="3" fill="#ea580c" />
      <circle cx="80" cy="20" r="3.5" fill="#16a34a" />
      <circle cx="-85" cy="18" r="3" fill="#16a34a" />

      <!-- Center text over dry cake: MASALA -->
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#1e293b" opacity="0.92" />
      <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="2">
        MASALA
      </text>
    </g>

    <!-- Tastemaker Sachet Callout Badge -->
    <rect x="235" y="525" width="330" height="32" rx="10" fill="#15803d" stroke="#86efac" stroke-width="1.5" />
    <text x="400" y="546" font-family="sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      ★ TASTEMAKER SACHET INSIDE PACKET ★
    </text>

    <!-- Net Weight & Kettle Cooking Badge -->
    <rect x="240" y="570" width="320" height="46" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="400" y="591" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      140g • 2 SEALED PACKETS
    </text>
    <text x="400" y="607" font-family="sans-serif" font-size="11" font-weight="extrabold" fill="#fbbf24" text-anchor="middle">
      COOK IN ELECTRIC KETTLE OR BOWL
    </text>

    <!-- Indian Vegetarian Green Square Dot Symbol -->
    <g transform="translate(230, 180)">
      <rect width="28" height="28" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
      <circle cx="14" cy="14" r="7" fill="#16a34a" />
    </g>

    <!-- Corner Diagonal Ribbon: RAW SEALED PACKET -->
    <g transform="translate(190, 140)">
      <path d="M 0,90 L 90,0 L 140,0 L 0,140 Z" fill="#dc2626" />
      <text transform="translate(55, 55) rotate(-45)" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        SEALED PACK
      </text>
    </g>

    <!-- Top Right: 100% Factory Sealed Stamp -->
    <g transform="translate(515, 175)">
      <circle cx="28" cy="28" r="26" fill="#1e293b" stroke="#facc15" stroke-width="2" />
      <text x="28" y="24" font-family="sans-serif" font-size="8" font-weight="900" fill="#94a3b8" text-anchor="middle">FACTORY</text>
      <text x="28" y="37" font-family="sans-serif" font-size="9" font-weight="900" fill="#4ade80" text-anchor="middle">SEALED</text>
    </g>

  </g>
</svg>
