<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="topramenBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241b14" />
      <stop offset="100%" stop-color="#0a0705" />
    </radialGradient>

    <!-- Orange-Red Pouch Gradient -->
    <linearGradient id="pouchOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="85%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Foil Sheen -->
    <linearGradient id="topramenSheen" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <pattern id="topramenCrimp" width="12" height="24" patternUnits="userSpaceOnUse">
      <rect width="6" height="24" fill="#7c2d12" />
      <rect x="6" width="6" height="24" fill="#fb923c" />
    </pattern>

    <filter id="topramenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#topramenBg)" />
  <circle cx="400" cy="400" r="280" fill="#ea580c" opacity="0.12" filter="blur(60px)" />

  <g filter="url(#topramenShadow)">
    <!-- Top Crimp -->
    <path d="M 210,130 
             L 215,122 L 225,130 L 235,122 L 245,130 L 255,122 L 265,130 L 275,122 L 285,130 L 295,122 L 305,130 
             L 315,122 L 325,130 L 335,122 L 345,130 L 355,122 L 365,130 L 375,122 L 385,130 L 395,122 L 405,130 
             L 415,122 L 425,130 L 435,122 L 445,130 L 455,122 L 465,130 L 475,122 L 485,130 L 495,122 L 505,130 
             L 515,122 L 525,130 L 535,122 L 545,130 L 555,122 L 565,130 L 575,122 L 585,130 L 590,130 
             L 590,165 L 210,165 Z" 
          fill="#c2410c" stroke="#7c2d12" stroke-width="1.5" />
    <rect x="210" y="130" width="380" height="35" fill="url(#topramenCrimp)" opacity="0.35" />

    <!-- Pouch Body -->
    <path d="M 210,165 C 195,300 195,500 210,635 L 590,635 C 605,500 605,300 590,165 Z" 
          fill="url(#pouchOrange)" stroke="#9a3412" stroke-width="2" />
    <path d="M 210,165 C 195,300 195,500 210,635 L 590,635 C 605,500 605,300 590,165 Z" 
          fill="url(#topramenSheen)" />

    <!-- Bottom Crimp -->
    <path d="M 210,635 L 590,635 L 590,670 
             L 585,678 L 575,670 L 565,678 L 555,670 L 545,678 L 535,670 L 525,678 L 515,670 L 505,678 L 495,670 
             L 485,678 L 475,670 L 465,678 L 455,670 L 445,678 L 435,670 L 425,678 L 415,670 L 405,678 L 395,670 
             L 385,678 L 375,670 L 365,678 L 355,670 L 345,678 L 335,670 L 325,678 L 315,670 L 305,678 L 295,670 
             L 285,678 L 275,670 L 265,678 L 255,670 L 245,678 L 235,670 L 225,678 L 215,670 L 210,670 Z" 
          fill="#c2410c" stroke="#7c2d12" stroke-width="1.5" />
    <rect x="210" y="635" width="380" height="35" fill="url(#topramenCrimp)" opacity="0.35" />

    <!-- Brand Header -->
    <text x="400" y="210" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3">
      NISSIN
    </text>

    <!-- TOP RAMEN Cartouche -->
    <rect x="245" y="225" width="310" height="60" rx="14" fill="#ffffff" stroke="#b91c1c" stroke-width="3" />
    <text x="400" y="268" font-family="'Arial Black', Impact, sans-serif" font-size="38" font-weight="900" fill="#b91c1c" text-anchor="middle" letter-spacing="1">
      TOP RAMEN
    </text>

    <!-- CURRY NOODLES Banner -->
    <rect x="260" y="300" width="280" height="34" rx="17" fill="#facc15" />
    <text x="400" y="323" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="1">
      CURRY VEG FLAT NOODLES
    </text>

    <!-- Raw Dry Noodles & Curry Features -->
    <g transform="translate(400, 440)">
      <rect x="-155" y="-70" width="310" height="135" rx="16" fill="#181310" stroke="#f97316" stroke-width="2" />
      <text x="0" y="-35" font-family="sans-serif" font-size="12" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1">
        ★ FACTORY SEALED POUCH ★
      </text>
      <text x="0" y="-10" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
        Curry Spice Seasoning Mix
      </text>
      <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="medium" fill="#fed7aa" text-anchor="middle">
        Flat wavy noodles for maximum sauce grip
      </text>
      <text x="0" y="38" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">
        ⚡ 3 MINS IN KETTLE BOILING WATER
      </text>
    </g>

    <rect x="235" y="525" width="330" height="32" rx="10" fill="#15803d" stroke="#86efac" stroke-width="1.5" />
    <text x="400" y="546" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      TASTEMAKER SACHET + DRIED VEGGIES
    </text>

    <rect x="240" y="570" width="320" height="46" rx="12" fill="#0f0c0a" stroke="#7c2d12" stroke-width="1.5" />
    <text x="400" y="591" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      100g • SEALED PACKET
    </text>
    <text x="400" y="607" font-family="sans-serif" font-size="11" font-weight="extrabold" fill="#facc15" text-anchor="middle">
      100% VEGETARIAN FLAT RAMEN
    </text>

    <!-- Corner Diagonal Ribbon -->
    <g transform="translate(190, 140)">
      <path d="M 0,90 L 90,0 L 140,0 L 0,140 Z" fill="#b91c1c" />
      <text transform="translate(55, 55) rotate(-45)" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        SEALED PACK
      </text>
    </g>

    <!-- Green Veg Mark -->
    <g transform="translate(230, 180)">
      <rect width="28" height="28" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
      <circle cx="14" cy="14" r="7" fill="#16a34a" />
    </g>
  </g>
</svg>
